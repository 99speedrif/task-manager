apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: taskmanager-backend:latest
        env:
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: taskmanager-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taskmanager-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: taskmanager-config
              key: DB_NAME
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres-clusterip;Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASSWORD)"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080